name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Generate Clean Project and Build APK
        run: |
          # Create a fresh flutter app
          flutter create --org com.swarai.app --project-name swar_ai app_build
          cd app_build
          
          # Add dependencies
          flutter pub add flutter_tts
          
          # Replace main.dart with custom code from root
          if [ -f "../lib/main.dart" ]; then
            cp ../lib/main.dart lib/main.dart
          fi
          
          # Build Release APK
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwarAI-Release-APK
          path: app_build/build/app/outputs/flutter-apk/app-release.apk
          
